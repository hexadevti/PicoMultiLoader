; PicoMultiLoader app metadata - see docs/apps.md
; Copy this folder to the root of the SD card, rename it, and edit the values.
[app]
name     = My App
author   = Your Name
version  = 1.0.0
category = Tools                ; Emulators | Tools | Dev | Media
icon     = icon.bmp
binary   = myapp.uf2            ; the file to run (.uf2 on the Picos, .bin on the ESP32-P4)
board    = rp2040, rp2350       ; rp2040 | rp2350 | esp32p4 | any
desc     = One line about what the app does.
